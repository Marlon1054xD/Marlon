<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habitación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container mt-5">

        <a
            href="/"
            class="btn btn-secondary mb-4"
        >
            ⬅️ Volver
        </a>

        <h1
            class="titulo mb-5"
            id="tituloHabitacion"
        >
            🛏️ Habitación
        </h1>

        <!-- FORMULARIO -->

        <div class="card bg-dark p-4 mb-5">

            <h3 class="mb-4">
                Registrar ingreso
            </h3>

            <input
                type="date"
                id="fecha"
                class="form-control mb-3"
            >

            <input
                type="number"
                id="valor"
                class="form-control mb-3"
                placeholder="Valor"
            >

            <input
                type="text"
                id="descripcion"
                class="form-control mb-3"
                placeholder="Descripción"
            >

            <select
                id="metodo_pago"
                class="form-control mb-3"
            >

                <option value="Efectivo">
                    💵 Efectivo
                </option>

                <option value="Transferencia">
                    🏦 Transferencia
                </option>

                <option value="Credito">
                    📒 Crédito
                </option>

            </select>

            <button
                class="btn btn-primary"
                onclick="crearRegistro()"
            >
                Guardar
            </button>

        </div>

        <!-- TABLA -->

        <div class="table-responsive">

            <table
                class="table table-dark table-bordered text-center align-middle"
            >

                <thead>

                    <tr>

                        <th>Día</th>
                        <th>Fecha</th>
                        <th>Valor</th>
                        <th>Descripción</th>
                        <th>Método</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tbody">

                </tbody>

            </table>

        </div>

    </div>

    <script>

        const params =
        new URLSearchParams(window.location.search);

        const habitacionId =
        params.get("id");

        const numeroHabitacion =
        params.get("numero");

        document.getElementById(
            "tituloHabitacion"
        ).innerHTML =
        `🛏️ Habitación ${numeroHabitacion}`;

        /* FECHA AUTOMÁTICA */

        document.getElementById("fecha").value =
        new Date().toISOString().split("T")[0];

        function formatearDinero(valor){

            return "$" + Number(valor)
            .toLocaleString("es-CO");

        }

        async function obtenerRegistros(){

            const response =
            await fetch(
                `/registros/${habitacionId}`
            );

            const data =
            await response.json();

            const tbody =
            document.getElementById("tbody");

            tbody.innerHTML = "";

            data.forEach(registro => {

                tbody.innerHTML += `

                <tr>

                    <td>
                        ${new Date(registro.fecha)
                        .getDate()}
                    </td>

                    <td>
                        ${new Date(registro.fecha)
                        .toLocaleDateString("es-CO")}
                    </td>

                    <td>
                        ${formatearDinero(registro.valor)}
                    </td>

                    <td>
                        ${registro.descripcion || "-"}
                    </td>

                    <td>
                        ${registro.metodo_pago || "-"}
                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm"
                            onclick="window.location.href='editar.html?id=${registro.id}'"
                        >
                            ✏️
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="eliminarRegistro(${registro.id})"
                        >
                            🗑️
                        </button>

                    </td>

                </tr>

                `;

            });

        }

        async function crearRegistro(){

            const fecha =
            document.getElementById("fecha").value;

            const valorInput =
            document.getElementById("valor").value;

            const valor =
            Number(valorInput);

            const descripcion =
            document.getElementById("descripcion").value.trim();

            const metodo_pago =
            document.getElementById("metodo_pago").value;

            if(!fecha || !valorInput || Number.isNaN(valor)){

                alert(
                    "❌ Por favor ingresa fecha y valor válidos."
                );

                return;

            }

            await fetch("/registros", {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    habitacion_id:
                    habitacionId,

                    fecha,
                    valor,
                    descripcion,
                    metodo_pago

                })

            });

            /* LIMPIAR FORMULARIO */

            document.getElementById("valor").value = "";

            document.getElementById("descripcion").value = "";

            document.getElementById("metodo_pago").selectedIndex = 0;

            /* VOLVER A PONER FECHA ACTUAL */

            document.getElementById("fecha").value =
            new Date().toISOString().split("T")[0];

            obtenerRegistros();

        }

        async function eliminarRegistro(id){

            const confirmar =
            confirm(
                "¿Eliminar registro?"
            );

            if(!confirmar){

                return;

            }

            await fetch(`/registros/${id}`, {

                method: "DELETE"

            });

            obtenerRegistros();

        }

        obtenerRegistros();

    </script>

</body>

</html>
