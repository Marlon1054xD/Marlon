<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Editar Registro
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container mt-5">

        <a
            href="/"
            class="btn btn-secondary mb-4"
        >
            ⬅️ Volver
        </a>

        <div class="card bg-dark p-5">

            <h1 class="mb-4">
                ✏️ Editar Registro
            </h1>

            <label class="mb-2">
                Fecha
            </label>

            <input
                type="date"
                id="fecha"
                class="form-control mb-4"
            >

            <label class="mb-2">
                Valor
            </label>

            <input
                type="number"
                id="valor"
                class="form-control mb-4"
            >

            <label class="mb-2">
                Descripción
            </label>

            <input
                type="text"
                id="descripcion"
                class="form-control mb-4"
            >

            <label class="mb-2">
                Método de pago
            </label>

            <select
                id="metodo_pago"
                class="form-control mb-4"
            >

                <option value="Efectivo">
                    💵 Efectivo
                </option>

                <option value="Transferencia">
                    🏦 Transferencia
                </option>

                <option value="Credito">
                    📒 Credito
                </option>

            </select>

            <button
                class="btn btn-warning"
                onclick="guardarCambios()"
            >
                💾 Guardar Cambios
            </button>

        </div>

    </div>

    <script>

        const params =
        new URLSearchParams(
            window.location.search
        );

        const id =
        params.get("id");

        async function cargarRegistro(){

            const response =
            await fetch(
                `/registro/${id}`
            );

            const data =
            await response.json();

            document.getElementById(
                "fecha"
            ).value =
            data.fecha.split("T")[0];

            document.getElementById(
                "valor"
            ).value =
            data.valor;

            document.getElementById(
                "descripcion"
            ).value =
            data.descripcion || "";

            document.getElementById(
                "metodo_pago"
            ).value =
            data.metodo_pago;

        }

        async function guardarCambios(){

            const fecha =
            document.getElementById(
                "fecha"
            ).value;

            const valor =
            document.getElementById(
                "valor"
            ).value;

            const descripcion =
            document.getElementById(
                "descripcion"
            ).value;

            const metodo_pago =
            document.getElementById(
                "metodo_pago"
            ).value;

            console.log({
                fecha,
                valor,
                descripcion,
                metodo_pago
            });

            await fetch(`/registros/${id}`, {

                method: "PUT",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    fecha,
                    valor,
                    descripcion,
                    metodo_pago

                })

            });

            alert(
                "✅ Registro actualizado"
            );

            window.location.href = "/";

        }

        cargarRegistro();

    </script>

</body>

</html>
