<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container-fluid mt-5">

        <a
            href="/"
            class="btn btn-secondary mb-4"
        >
            ⬅️ Volver
        </a>

        <h1 class="titulo">
            📊 Reporte Quincenal
        </h1>

        <!-- FILTROS -->

        <div class="card bg-dark p-4 mb-5">

            <div class="row">

                <div class="col-md-4">

                    <label class="mb-2">
                        Mes
                    </label>

                    <select
                        id="mes"
                        class="form-control"
                    >
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>

                </div>

                <div class="col-md-4">

                    <label class="mb-2">
                        Año
                    </label>

                    <input
                        type="number"
                        id="anio"
                        class="form-control"
                        value="2026"
                    >

                </div>

                <div class="col-md-4">

                    <label class="mb-2">
                        Quincena
                    </label>

                    <select
                        id="quincena"
                        class="form-control"
                    >
                        <option value="1">
                            Primera (1 - 15)
                        </option>

                        <option value="2">
                            Segunda (16 - Final)
                        </option>
                    </select>

                </div>

            </div>

            <button
                class="btn btn-primary mt-4"
                onclick="generarReporte()"
            >
                Generar Reporte
            </button>

        </div>

        <!-- TABLA -->

        <div class="table-responsive">

            <table
                class="table table-dark table-bordered text-center align-middle"
                id="tablaReporte"
            >

            </table>

        </div>

    </div>

    <script>

        async function generarReporte(){

            const mes =
            document.getElementById("mes").value;

            const anio =
            document.getElementById("anio").value;

            const quincena =
            document.getElementById("quincena").value;

            const response =
            await fetch(
                `/reporte?mes=${mes}&anio=${anio}&quincena=${quincena}`
            );

            const data =
            await response.json();

            construirTabla(data);

        }

        function formatearDinero(valor){

            return "$" + Number(valor)
            .toLocaleString("es-CO");

        }

        function construirTabla(data){

            let totalEfectivo = 0;
            let totalTransferencia = 0;
            let totalCredito = 0;

            const tabla =
            document.getElementById("tablaReporte");

            tabla.innerHTML = "";

            const dias =
            data.dias;

            const habitaciones =
            data.habitaciones;

            let html = `
            
                <thead>

                    <tr>

                        <th>Habitación</th>
            `;

            dias.forEach(dia => {

                html += `
                
                    <th>${dia}</th>
                
                `;

            });

            html += `
            
                        <th>Total</th>

                    </tr>

                </thead>

                <tbody>
            `;

            habitaciones.forEach(habitacion => {

                let total = 0;

                html += `
                
                    <tr>

                        <td>
                            ${habitacion.numero}
                        </td>
                `;

                dias.forEach(dia => {

                    const registro =
                    habitacion.registros[dia]
                    || {
                        valor: 0,
                        metodo_pago: "-"
                    };

                    const valor =
                    registro.valor;

                    const metodoPago =
                    registro.metodo_pago;

                    if(metodoPago == "Efectivo"){

                        totalEfectivo +=
                        Number(valor);

                    }

                    if(metodoPago == "Transferencia"){

                        totalTransferencia +=
                        Number(valor);

                    }

                    if(metodoPago == "Credito"){

                        totalCredito +=
                        Number(valor);

                    }

                    let valorMostrar = "-";

                    if(valor > 0){

                        if(metodoPago == "Efectivo"){

                            valorMostrar =
                            formatearDinero(valor);

                        }

                        if(metodoPago == "Transferencia"){

                            valorMostrar =
                            `Trans ${formatearDinero(valor)}`;

                        }

                        if(metodoPago == "Credito"){

                            valorMostrar =
                            `* ${formatearDinero(valor)}`;

                        }

                    }

                    total += Number(valor);

                    html += `
                    
                        <td>
                            ${valorMostrar}
                        </td>
                    `;

                });

                html += `
                
                        <td>

                            <strong>
                                ${formatearDinero(total)}
                            </strong>

                        </td>

                    </tr>
                `;

            });

            html += `
            
                </tbody>

                <tfoot>

                    <tr>

                        <th colspan="100%">

                            💵 Total Efectivo:
                            ${formatearDinero(totalEfectivo)}

                            |

                            🏦 Total Bancos:
                            ${formatearDinero(totalTransferencia)}

                            |

                            📒 Saldo por Cobrar:
                            ${formatearDinero(totalCredito)}

                        </th>

                    </tr>

                </tfoot>
            `;

            tabla.innerHTML = html;

        }

    </script>

</body>

</html>
